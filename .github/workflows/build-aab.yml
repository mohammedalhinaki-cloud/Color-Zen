name: Build AAB

# Builds and tests Color Zen on every push. Google Play accepts AAB only, so
# the release job produces an Android App Bundle (`bundleRelease`).
#
# Uses only GitHub-owned actions (checkout / setup-java / upload-artifact) and
# the Android SDK pre-installed on the ubuntu runners, so it also passes
# organisations that restrict which third-party actions may run.
#
# Optional signing: add these repository secrets to get a *signed* AAB that can
# be uploaded straight to Play Console:
#   KEYSTORE_BASE64     base64 of the upload .jks/.keystore file
#   KEYSTORE_PASSWORD   keystore password
#   KEY_ALIAS           key alias
#   KEY_PASSWORD        key password
# Without them the bundle is signed with the debug key (fine for CI checks,
# NOT for Play upload).

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  build-aab:
    name: Release AAB
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode upload keystore (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=../release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "Signing release with the uploaded keystore."

      - name: Build release bundle
        run: ./gradlew bundleRelease --stacktrace

      - name: Show bundle info
        run: |
          ls -la app/build/outputs/bundle/release/
          du -h app/build/outputs/bundle/release/*.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: colorzen-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
