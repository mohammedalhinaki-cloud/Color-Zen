name: Build AAB

# Builds and tests Color Zen on every push. Google Play accepts AAB only, so
# the release job produces an Android App Bundle (`bundleRelease`).
#
# Uses only GitHub-owned actions (checkout / setup-java / upload-artifact) and
# the Android SDK pre-installed on the ubuntu runners.
#
# Optional signing: add these repository secrets to get a *signed* AAB that
# can be uploaded straight to Play Console:
#   KEYSTORE_BASE64     base64 of the upload .jks/.keystore file
#   KEYSTORE_PASSWORD   keystore password
#   KEY_ALIAS           key alias
#   KEY_PASSWORD        key password
# Without them the bundle is signed with the debug key (fine for CI checks,
# NOT for Play upload).

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run unit tests
        run: set -o pipefail; ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee gradle-tests.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: gradle-tests.log
          if-no-files-found: ignore

      # Echo the interesting failure lines as workflow annotations, which stay
      # readable through the check-run API even when raw logs/artifacts are
      # hard to reach.
      - name: Surface failures as annotations
        if: failure()
        run: |
          {
            grep -E "FAILED|error:|^e: |What went wrong|Caused by:|> " gradle-tests.log \
              | grep -v "^> Task"
            # Candidate lists for "None of the following candidates" errors and
            # assertion messages are printed on the following indented lines.
            grep -A4 "None of the following candidates" gradle-tests.log | grep -v "^--$"
            grep -A6 " FAILED$" gradle-tests.log | grep -v "^--$"
          } | head -30 | while IFS= read -r line; do
            echo "::error::${line:0:240}"
          done

  build-aab:
    name: Release AAB
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Guarded in the shell instead of an `if:` expression so the workflow
      # lints even in organisations that restrict secret access in conditions.
      - name: Decode upload keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret set - building with debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=../release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "Signing release with the uploaded keystore."

      - name: Build release bundle
        run: set -o pipefail; ./gradlew bundleRelease --stacktrace 2>&1 | tee gradle-bundle.log

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-bundle-failure-log
          path: gradle-bundle.log
          if-no-files-found: ignore

      - name: Show bundle info
        run: |
          ls -la app/build/outputs/bundle/release/
          du -h app/build/outputs/bundle/release/*.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: colorzen-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
